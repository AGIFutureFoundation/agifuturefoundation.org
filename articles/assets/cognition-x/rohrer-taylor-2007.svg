<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="t d">
<title id="t">Blocked versus interleaved practice: accuracy during practice and on a test one week later (Rohrer &amp; Taylor, 2007)</title>
<desc id="d">Grouped bar chart. During practice: blocked 89%, interleaved 60%. On a test one week later: blocked 20%, interleaved 63%.</desc>
<rect width="860" height="440" fill="#f6f7f9"/>
<text x="30" y="34" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1e3a">Blocked practice feels better. Interleaved practice lasts longer.</text>
<text x="30" y="56" font-family="system-ui, sans-serif" font-size="13" fill="#5b6b7d">Accuracy (%) in Rohrer &amp; Taylor (2007), mathematics practice. The group that looked worse in practice won a week later.</text>
<g font-family="system-ui, sans-serif" font-size="13" fill="#5b6b7d">
<line x1="80" y1="90" x2="80" y2="340" stroke="#5b6b7d"/>
<line x1="80" y1="340" x2="820" y2="340" stroke="#5b6b7d"/>
<text x="70" y="345" text-anchor="end">0</text>
<text x="70" y="285" text-anchor="end">25</text>
<text x="70" y="225" text-anchor="end">50</text>
<text x="70" y="165" text-anchor="end">75</text>
<text x="70" y="105" text-anchor="end">100</text>
<line x1="80" y1="280" x2="820" y2="280" stroke="#e2e6ec"/>
<line x1="80" y1="220" x2="820" y2="220" stroke="#e2e6ec"/>
<line x1="80" y1="160" x2="820" y2="160" stroke="#e2e6ec"/>
<line x1="80" y1="100" x2="820" y2="100" stroke="#e2e6ec"/>
</g>
<g font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#14202e">
<!-- During practice: blocked 89, interleaved 60. Scale: 2.4px per percent, baseline y=340 -->
<rect x="170" y="126" width="110" height="214" fill="#123a6b"/>
<text x="225" y="116" text-anchor="middle">89%</text>
<rect x="300" y="196" width="110" height="144" fill="#0e7c7b"/>
<text x="355" y="186" text-anchor="middle">60%</text>
<!-- One week later: blocked 20, interleaved 63 -->
<rect x="540" y="292" width="110" height="48" fill="#123a6b"/>
<text x="595" y="282" text-anchor="middle">20%</text>
<rect x="670" y="189" width="110" height="151" fill="#0e7c7b"/>
<text x="725" y="179" text-anchor="middle">63%</text>
</g>
<g font-family="system-ui, sans-serif" font-size="14" fill="#14202e">
<text x="290" y="368" text-anchor="middle">During practice</text>
<text x="660" y="368" text-anchor="middle">Test one week later</text>
</g>
<g font-family="system-ui, sans-serif" font-size="13" fill="#14202e">
<rect x="300" y="392" width="16" height="16" fill="#123a6b"/><text x="322" y="405">Blocked practice (one topic at a time)</text>
<rect x="600" y="392" width="16" height="16" fill="#0e7c7b"/><text x="622" y="405">Interleaved practice (topics mixed)</text>
</g>
<text x="30" y="432" font-family="system-ui, sans-serif" font-size="12" fill="#5b6b7d">Source: Rohrer &amp; Taylor (2007), as reported in Dunlosky et al. (2013) and Bjork &amp; Bjork (2011). Percentages are accuracy on mathematics problems.</text>
</svg>
