<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="t d">
<title id="t">Baars's theatre of consciousness: the global workspace</title>
<desc id="d">Simplified diagram based on Baars (1988) and Dehaene &amp; Naccache (2001). A stage with a spotlight represents the contents of consciousness. Specialist processors sit in the audience: perception, memory, language, planning, motor control, emotion. When information wins the competition for the stage, it is broadcast to the whole audience; information that never reaches the stage is processed unconsciously by specialists alone.</desc>
<rect width="860" height="480" fill="#f6f7f9"/>
<text x="30" y="34" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1e3a">The theatre of consciousness (Baars, 1988)</text>
<text x="30" y="56" font-family="system-ui, sans-serif" font-size="13" fill="#5b6b7d">Simplified diagram based on Baars's global workspace theory and the neuronal version of Dehaene &amp; Naccache (2001).</text>
<rect x="280" y="80" width="300" height="110" rx="8" fill="#0b1e3a"/>
<text x="430" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">THE STAGE — the global workspace</text>
<text x="430" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#dbe6f5">Whatever stands here is broadcast</text>
<text x="430" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#dbe6f5">to the whole audience at once</text>
<polygon points="430,60 400,80 460,80" fill="#c9a227"/>
<text x="430" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8a6d00">spotlight of attention</text>
<g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#14202e">
<g><rect x="60" y="250" width="180" height="52" rx="10" fill="#ffffff" stroke="#0e7c7b" stroke-width="2"/><text x="150" y="282" text-anchor="middle">PERCEPTION</text></g>
<g><rect x="270" y="250" width="180" height="52" rx="10" fill="#ffffff" stroke="#0e7c7b" stroke-width="2"/><text x="360" y="282" text-anchor="middle">MEMORY</text></g>
<g><rect x="480" y="250" width="180" height="52" rx="10" fill="#ffffff" stroke="#0e7c7b" stroke-width="2"/><text x="570" y="282" text-anchor="middle">LANGUAGE</text></g>
<g><rect x="60" y="330" width="180" height="52" rx="10" fill="#ffffff" stroke="#0e7c7b" stroke-width="2"/><text x="150" y="362" text-anchor="middle">PLANNING</text></g>
<g><rect x="270" y="330" width="180" height="52" rx="10" fill="#ffffff" stroke="#0e7c7b" stroke-width="2"/><text x="360" y="362" text-anchor="middle">MOTOR CONTROL</text></g>
<g><rect x="480" y="330" width="180" height="52" rx="10" fill="#ffffff" stroke="#0e7c7b" stroke-width="2"/><text x="570" y="362" text-anchor="middle">EMOTION &amp; VALUE</text></g>
</g>
<g stroke="#c9a227" stroke-width="2">
<line x1="330" y1="190" x2="150" y2="250"/>
<line x1="380" y1="190" x2="360" y2="250"/>
<line x1="480" y1="190" x2="570" y2="250"/>
<line x1="430" y1="190" x2="150" y2="330"/>
<line x1="430" y1="190" x2="360" y2="330"/>
<line x1="530" y1="190" x2="570" y2="330"/>
</g>
<text x="700" y="290" font-family="system-ui, sans-serif" font-size="13" fill="#5b6b7d">← broadcast</text>
<text x="700" y="312" font-family="system-ui, sans-serif" font-size="13" fill="#5b6b7d">reaches every</text>
<text x="700" y="334" font-family="system-ui, sans-serif" font-size="13" fill="#5b6b7d">specialist at once</text>
<text x="430" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5b6b7d">Specialists compete for the stage. Most processing never reaches it — and stays unconscious.</text>
<text x="430" y="444" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5b6b7d">Conscious access, in this theory, is global availability: information any processor can use.</text>
</svg>
