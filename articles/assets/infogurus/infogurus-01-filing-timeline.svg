  <text x="30" y="282" font-family="system-ui, sans-serif" font-size="12" fill="#5b6b7d">Teal = AGI Future Foundation (CA Nonprofit Public Benefit Corp). Gold = AGI Fellowship (CA Nonprofit Religious Corp). Source: filing records reviewed 2026-11-03.</text>
