<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="Bar chart: the 33 named W3 sub-series grouped by the Foundation site's eight article categories. Health and Life Sciences has 10, Community Learning and Culture has 7, and the other six categories have 3, 3, 3, 3, 3 and 1.">
