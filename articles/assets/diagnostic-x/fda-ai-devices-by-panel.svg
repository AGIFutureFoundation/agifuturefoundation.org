<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="Bar chart: FDA-authorized AI-enabled medical devices by lead review panel. Radiology 1,230; Cardiovascular 154; Neurology 73; Anesthesiology 30; Gastroenterology and Urology 27; Hematology 22; all other panels 78. Total 1,614.">
  <rect width="760" height="420" fill="#f6f7f9"/>
  <text x="30" y="34" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#0b1e3a">FDA-authorized AI-enabled devices, by lead review panel</text>
  <text x="30" y="56" font-family="system-ui, sans-serif" font-size="12" fill="#5b6b7d">Tally of the FDA AI-Enabled Medical Devices list (entries through 29 June 2026; 1,614 entries).</text>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#14202e">
    <text x="30" y="96">Radiology</text>
    <rect x="260" y="82" width="420" height="20" fill="#0e7c7b"/><text x="688" y="97" font-weight="700">1,230</text>
    <text x="30" y="132">Cardiovascular</text>
    <rect x="260" y="118" width="53" height="20" fill="#123a6b"/><text x="321" y="133" font-weight="700">154</text>
    <text x="30" y="168">Neurology</text>
    <rect x="260" y="154" width="25" height="20" fill="#123a6b"/><text x="293" y="169" font-weight="700">73</text>
    <text x="30" y="204">Anesthesiology</text>
    <rect x="260" y="190" width="10" height="20" fill="#123a6b"/><text x="278" y="205" font-weight="700">30</text>
    <text x="30" y="240">Gastroenterology &amp; Urology</text>
    <rect x="260" y="226" width="9" height="20" fill="#123a6b"/><text x="277" y="241" font-weight="700">27</text>
    <text x="30" y="276">Hematology</text>
    <rect x="260" y="262" width="8" height="20" fill="#123a6b"/><text x="276" y="277" font-weight="700">22</text>
    <text x="30" y="312">All other panels (12 panels)</text>
    <rect x="260" y="298" width="27" height="20" fill="#c9a227"/><text x="295" y="313" font-weight="700">78</text>
  </g>
  <text x="30" y="356" font-family="system-ui, sans-serif" font-size="12" fill="#5b6b7d">Radiology holds about 76% of the list. The panel records who reviewed a device, not where it is used.</text>
  <text x="30" y="376" font-family="system-ui, sans-serif" font-size="12" fill="#5b6b7d">Source: FDA AI-Enabled Medical Devices list (Sept 2026 update), as tallied by Lymy Voyage from the FDA file downloaded 23 Oct 2026.</text>
  <text x="30" y="396" font-family="system-ui, sans-serif" font-size="12" fill="#5b6b7d">The FDA notes the list is not a comprehensive resource of AI-enabled devices.</text>
</svg>
