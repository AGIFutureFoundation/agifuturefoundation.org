<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Timeline of the Foundation and Fellowship filings in 2026">
  <rect width="720" height="260" fill="#ffffff"/>
