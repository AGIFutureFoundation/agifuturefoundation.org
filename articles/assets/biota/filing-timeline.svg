  <g font-family="sans-serif" font-size="13" fill="#14202e">
    <circle cx="120" cy="130" r="8" fill="#2471a3"/>
    <text x="120" y="100" text-anchor="middle" font-weight="bold">24 Apr 2026</text>
    <text x="120" y="165" text-anchor="middle">Foundation filed</text>
    <text x="120" y="184" text-anchor="middle">Entity B20260196664</text>
    <circle cx="280" cy="130" r="8" fill="#2471a3"/>
