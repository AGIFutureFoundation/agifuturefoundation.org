<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="t d">
<title id="t">Filing timeline: the Foundation and the Fellowship, April to May 2026</title>
<desc id="d">Timeline from 24 April to 18 May 2026. Foundation: articles filed 24 April 2026; SOS approval 30 April 2026; San Francisco business registration 6 May 2026; EIN assigned 7 May 2026. Fellowship: articles filed 13 May 2026; SOS approval and EIN assigned 18 May 2026. Neither entity has an IRS 501(c)(3) determination letter on file.</desc>
